/* Layout: one calm column. Painted olive-grove band on top, a rounded step card below, a sticky Back / Decide later / Next bar. Each step has its own pastel tile. */
:root{
  --bg:#FBF1EE; --surface:#FFFBF9; --ink:#3B4439; --muted:#76806F; --line:#EBDAD5;
  --blush:#F5D5D1; --sage:#D3E2CF; --butter:#F7E8BF; --lilac:#E0D8EE; --sky:#D5E5EF;
  --accent:#A5566A; --accent-ink:#FFFFFF; --ok:#4E7A55; --warn:#A8721E; --bad:#A83E3E;
  --sea:#CFE2EC; --hill1:#DCE8D4; --hill2:#C6D9BD; --tree:#9DB890; --trunk:#B9A592;
  --f-display:'Bodoni Moda','Didot','Times New Roman',serif; --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){

  --accent:#E3A0B1; --accent-ink:#2A1A1F; --ok:#8FC79A; --warn:#E5B866; --bad:#E89090;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;

.brand b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.05rem;line-height:1.1;display:block}
.brand small{color:var(--muted);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase}
.topright{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lang{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px}
.lang button{border:0;background:none;color:var(--muted);font:inherit;font-size:.8rem;font-weight:600;padding:5px 11px;border-radius:99px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sync{font-size:.74rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 10px;background:var(--surface)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.synced i{background:var(--ok)}.sync.saving i{background:var(--warn)}.sync.error i,.sync.readonly i{background:var(--bad)}
.scene{display:block;width:100%;height:auto;margin-top:10px;border-radius:22px}
.prog{display:flex;gap:5px;margin:14px 0 6px}
.prog i{flex:1;height:5px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--accent)} .prog i.sk{background:var(--warn)}
.stepname{color:var(--muted);font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:18px}
.tile{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.t-blush{background:var(--blush)}.t-sage{background:var(--sage)}.t-butter{background:var(--butter)}.t-lilac{background:var(--lilac)}.t-sky{background:var(--sky)}.t-plain{background:var(--surface);border:1px solid var(--line)}
.lead{color:var(--muted);max-width:60ch}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.85rem;font-weight:600;min-width:0}
input[type=text],input[type=date],input[type=number],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1.3rem;cursor:pointer;flex:none}
.stepper input{text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-size:.88rem;border-radius:99px;padding:8px 14px;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.sm{padding:4px 10px;min-height:30px;font-size:.78rem}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;border-radius:16px;padding:14px;cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.opt .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;margin-top:2px;display:grid;place-items:center;font-size:.8rem}
.opt[aria-pressed="true"] .tick{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt b{display:block}.opt span.s{color:var(--muted);font-size:.86rem}
.tag{display:inline-block;font-size:.72rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--ink)}

/* ---------- sync with the venue (db + user capabilities) ---------- */
let DB=null,UID=null,OWNER=false,SYNC='local',pushT=null,writing=false,pendingW=false,unsubPlan=null;
function syncLabel(){return {local:L('Saved on this phone','Salvato su questo telefono'),synced:L('Synced with the venue','Sincronizzato con la location'),saving:L('Saving…','Salvataggio…'),error:L('Sync problem, kept on this phone','Problema di sincronizzazione, salvato sul telefono'),readonly:L('View only here, kept on this phone','Solo lettura qui, salvato sul telefono')}[SYNC]}
function renderSync(){const el=$('#sync');el.className='sync '+SYNC;$('#synctext').textContent=syncLabel()}
function serial(){const o=Object.assign({},S);delete o.step;return o}
function schedulePush(){if(!DB||!UID)return;clearTimeout(pushT);pushT=setTimeout(push,1200)}
function push(){if(!DB||!UID)return;if(writing){pendingW=true;return}writing=true;SYNC='saving';renderSync();
  DB.doc('plans/'+UID).set(serial()).then(()=>{SYNC='synced'},e=>{SYNC=(e&&e.code==='invalid_argument')?'readonly':'error'}).finally(()=>{writing=false;renderSync();if(pendingW){pendingW=false;push()}})}
function adopt(r){const keep={step:S.step,lang:S.lang};S=Object.assign(blank(),r,keep);S.tables=S.tables.map((t,i)=>Object.assign({x:DEFPOS[i%10][0],y:DEFPOS[i%10][1]},t));save();render()}
async function initSync(){
  if(!window.claude||!window.claude.use)return;
  let db=null,user=null;try{[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')])}catch(e){return}
  if(!user)return;
  try{OWNER=await user.isOwner()}catch(e){OWNER=false}
  if(OWNER){$('#venuebtn').hidden=false}
  if(!db)return;
  try{UID=await user.id()}catch(e){UID=null}
  if(!UID)return;
  DB=db;const ref=db.doc('plans/'+UID);
  try{const snap=await ref.get();if(snap.exists){const r=snap.data();if((r.updated||0)>(S.updated||0))adopt(r);else if((S.updated||0)>(r.updated||0))schedulePush()}else if(S.updated)schedulePush();SYNC='synced'}catch(e){SYNC='error'}
  renderSync();
  unsubPlan=ref.onSnapshot(snap=>{if(snap.metadata.hasPendingWrites||!snap.exists)return;const r=snap.data();if((r.updated||0)>(S.updated||0))adopt(r)},err=>{SYNC='error';renderSync()});
}

/* ---------- estimates and budget ---------- */
function est(){
  const e={},ng=nights(),ppl=people();
  const rooms=num(S.hrooms)||Math.ceil(ppl/2);e.rooms=rooms;e.nights=ng;
  const nightly=HOTELS.map(h=>h.tot/2).sort((a,b)=>a-b);const med=nightly[Math.floor(nightly.length/2)];
  e.hotelTypical=ng&&rooms?med*rooms*ng:null;
  const picks=HOTELS.filter(h=>has('hpicks',h.id));
  e.hotelPicks=picks.map(h=>({h,v:ng&&rooms?h.tot/2*rooms*ng:null}));
  e.hotelRange=picks.length&&ng&&rooms?[Math.min(...picks.map(h=>h.tot/2))*rooms*ng,Math.max(...picks.map(h=>h.tot/2))*rooms*ng]:null;
  const pax=num(S.tpax)||total();e.tpax=pax;
  if(S.tmode==='public')e.transfer=[pax*2*6,pax*2*13];
  else if(S.tmode==='private'){const veh=num(S.tveh)||Math.ceil(pax/4);e.veh=veh;e.transfer=[veh*2*270,veh*2*380]}
  else e.transfer=null;
  const fp=num(S.fPax)||ppl+num(S.kids);e.fpax=fp;
  const fare=parseFloat(S.fFare);e.flight=fare>0?fp*fare:null;
  return e;
}
function rng(r){return r?`${fmtEUR(r[0])} – ${fmtEUR(r[1])}`:L('Needs a quote','Su preventivo')}
function budget(){
  const pay=people(),base=Math.max(pay,MIN_GUESTS),lines=[];
  const pk=PK.find(p=>p.id===S.pkg);
  if(pk)lines.push({k:L('Menu','Menu')+' '+pkgName(pk.id),q:`${base} × ${fmtEUR(pk.eur)}`,v:base*pk.eur});
  if(S.wine)lines.push({k:L('Wines and sparkling from the cellar','Vini e spumanti della cantina'),q:`${base} × ${fmtEUR(WINE_EUR)}`,v:base*WINE_EUR});
  EXTRAS.forEach(x=>{if(has('extras',x[0])){if(x[3])lines.push({k:L(x[1],x[2]),q:`${base} × ${fmtEUR(x[3])}`,v:base*x[3]});else lines.push({k:L(x[1],x[2]),q:L('€8 per drink, on consumption','€8 a drink, a consumo'),v:0,open:true})}});
  lines.push({k:L('Villa and olive grove, exclusive use until 01:00','Villa e uliveto, uso esclusivo fino alle 01:00'),q:'',v:VILLA_RENT});
  if(has('villa','late')){const h=Math.max(1,num(S.lateHours));lines.push({k:L('Extra hours after 01:00','Ore extra dopo le 01:00'),q:`${h} × ${fmtEUR(LATE_HOUR)}`,v:h*LATE_HOUR})}
  if(has('villa','setup'))lines.push({k:lab(VILLA,'setup'),q:'',v:SETUP_EUR});
  if(has('villa','overnight'))lines.push({k:L('Overnight in the villa','Pernottamento in villa'),q:'',v:OVERNIGHT_EUR});
  if(has('villa','brunch'))lines.push({k:L('Brunch the day after','Brunch il giorno dopo'),q:L('on request','su richiesta'),v:0,open:true});
  const tot=lines.reduce((a,l)=>a+l.v,0);
  const e=est(),travel=[];
  if(has('exp','transfer')&&e.transfer)travel.push({k:L('Transfers','Trasferimenti'),q:rng(e.transfer)});
  if(has('exp','hotel')&&e.hotelTypical)travel.push({k:L('Hotels, typical','Hotel, tipico'),q:fmtEUR(e.hotelTypical)+(e.hotelRange?' ('+rng(e.hotelRange)+' '+L('shortlist','in lista')+')':'')});
  if(has('exp','flight')&&e.flight)travel.push({k:L('Flights','Voli'),q:fmtEUR(e.flight)});
  return {lines,tot,pay,base,minApplied:pay<MIN_GUESTS&&pay>0,travel,sched:[[L('Deposit at signing (15%)','Caparra alla firma (15%)'),tot*.15,S.contract],[L('Second payment, 60 days before (50%)','Secondo acconto, 60 giorni prima (50%)'),tot*.5,addDays(S.wed,-60)],[L('Balance, the day before (35%)','Saldo, il giorno prima (35%)'),tot*.35,addDays(S.wed,-1)]]};
}

/* ---------- checklist: dates from the venue's contract terms ---------- */
function checklist(){
  const W=S.wed,C=S.contract,it=[];
  it.push({id:'visit',en:'Visit the villa and the olive grove',it:'Sopralluogo alla villa e all’uliveto',date:'',src:'venue'});
  it.push({id:'sign',en:'Sign the contract and pay the 15% deposit',it:'Firmare il contratto e versare la caparra del 15%',date:C,src:'terms',input:'contract'});
  it.push({id:'withdraw',en:'Last day to withdraw (14 days after signing)',it:'Ultimo giorno per il recesso (14 giorni dalla firma)',date:addDays(C,14),src:'terms'});
  it.push({id:'tasting',en:'Menu tasting with the chefs; give an indicative guest number',it:'Prova del menu con gli chef; numero indicativo di ospiti',date:S.tasting,src:'terms',input:'tasting'});
  it.push({id:'second',en:'Second payment: 50% of the total',it:'Secondo acconto: 50% del totale',date:addDays(W,-60),src:'terms'});
  it.push({id:'final',en:'Final guest count to the venue',it:'Numero definitivo di ospiti alla location',date:addDays(W,-30),src:'terms'});
  it.push({id:'allergy',en:'Send the allergy and intolerance list to the chefs',it:'Inviare agli chef la lista di allergie e intolleranze',date:addDays(W,-30),src:'sugg'});
  it.push({id:'reduce',en:'Last day to reduce the count (max 5%) or add guests',it:'Ultimo giorno per ridurre (max 5%) o aggiungere ospiti',date:addDays(W,-10),src:'terms'});
  it.push({id:'seatplan',en:'Seating plan and table names to the venue',it:'Piano dei tavoli e nomi dei tavoli alla location',date:addDays(W,-10),src:'sugg'});
  it.push({id:'balance',en:'Balance paid',it:'Saldo versato',date:addDays(W,-1),src:'terms'});
  it.push({id:'day',en:'Wedding day · exclusive use until 01:00',it:'Giorno del matrimonio · uso esclusivo fino alle 01:00',date:W,src:'venue'});
  if(has('villa','brunch'))it.push({id:'brunch',en:'Brunch the day after',it:'Brunch il giorno dopo',date:addDays(W,1),src:'venue'});
  it.forEach(x=>{x.done=!!S.checks[x.id];x.left=x.date?daysUntil(x.date):null;x.state=x.done?'done':(x.left===null?'nodate':(x.left<0?'over':(x.left<=14?'soon':'later')))});
  return it;
}

function tendency(){let f=0,s=0;if(S.pkg==='biancolilla')f+=2;if(['nocellara','leccino','moraiola'].includes(S.pkg))s+=2;['burger','pizza','spaghetto','bbqMeat','bbqFish'].forEach(x=>{if(has('extras',x))f++});return f>s?'informal':(s>f?'seated':'')}
function suggestions(){
  const out=[],t=total(),c=rsvpCounts();
  const add=(k,en,it)=>{const w=S.fb[k]||0;if(w>=0)out.push({k,en,it,w})};
  if(t>=40&&!has('exp','transfer'))add('shuttle','With '+t+' guests, a shuttle from the stations or hotels saves a lot of car coordination. The venue has parking and coach access.','Con '+t+' ospiti una navetta da stazioni o hotel semplifica molto gli spostamenti. La location ha parcheggio e accesso per pullman.');
  if(num(S.seniors)>0&&!has('exp','transfer'))add('seniors','You have senior couples. Door-to-door transfers are the easiest option for them.','Avete coppie di anziani. I trasferimenti porta a porta sono la soluzione più comoda.');
  if(S.arrive&&S.wed&&S.arrive<S.wed&&!has('exp','hotel'))add('hotel','Some guests arrive before the wedding day. Add hotels so you see rooms and nights worked out.','Alcuni ospiti arrivano prima del giorno delle nozze. Aggiungete gli hotel per vedere camere e notti calcolate.');
  if(t>0&&t<MIN_GUESTS)add('min70','The venue’s price list assumes a minimum of 70 guests (to be agreed). Your count is '+t+'.','Il listino della location prevede un minimo di 70 ospiti (da concordare). Il vostro numero è '+t+'.');
  if(num(S.kids)>0)add('kids','Children under 10 are welcome guests of the house, per the venue’s price list. Mark them as “Child” in the guest list.','I bambini sotto i 10 anni sono ospiti graditi della casa, come da listino. Segnateli come “Bambino” nella lista ospiti.');
  if(S.wed&&S.depart&&S.depart>S.wed&&!has('villa','brunch'))add('brunch','You stay after the wedding. A brunch the day after can be arranged.','Restate dopo le nozze. Si può organizzare un brunch il giorno dopo.');
  if(tendency()==='informal'&&!has('extras','openbar'))add('informal','Your choices lean informal. An open bar from the cake cutting and a midnight spaghetto fit that evening.','Le vostre scelte sono informali. Open bar dopo la torta e spaghetto di mezzanotte ci stanno bene.');
  if(!S.demo&&c.pending>0&&c.pending/S.guests.length>0.2)add('chase','More than a fifth of your guests have not answered. The final count is due 30 days before the wedding.','Più di un quinto degli ospiti non ha risposto. Il numero definitivo va dato 30 giorni prima delle nozze.');
  if(!S.demo&&c.veg+c.vegan>0&&!has('diets','vegetarian')&&!has('diets','vegan'))add('vegdiet','Your guest list has vegetarian or vegan meals but the diets step does not mention them. Tick them so the chefs plan for it.','Nella lista ospiti ci sono pasti vegetariani o vegani ma nel passaggio diete non sono indicati. Selezionateli così gli chef si organizzano.');
  if(S.skipped.includes('seating'))add('seat','The seating plan is still waiting. Tables are named after olive varieties and can be renamed and dragged on the floor plan.','Il piano dei tavoli è ancora da fare. I tavoli portano nomi di varietà di olive, si possono rinominare e spostare sulla planimetria.');
  const over=checklist().filter(x=>x.state==='over');if(over.length)add('over',over.length+' checklist item(s) are past their date.',over.length+' voci della checklist sono scadute.');
  return out.sort((a,b)=>b.w-a.w);
}

  <div><h3>${L('Starter and first course','Antipasto e primo')}</h3><p class="note" style="margin:4px 0 10px">${L('The dishes are agreed with the chefs at the tasting. Tell us what you lean towards.','I piatti si concordano con gli chef durante la prova. Indicate le vostre preferenze.')}</p>
   <div class="chips">${PREFS.map(p=>chip('pref',p[0],L(p[1],p[2]))).join('')}</div></div>

  <div><h3>${L('Extra food and drink','Extra food e bevande')}</h3><div class="grid" style="margin-top:8px">${EXTRAS.map(x=>optBtn('extras',x[0],L(x[1],x[2]))).join('')}</div></div>

   ${has('villa','late')?`<div class="grid" style="margin-top:10px"><label class="f">${L('Extra hours after 01:00','Ore extra dopo le 01:00')}<input type="number" min="1" max="4" data-bind="lateHours" value="${esc(S.lateHours)}"></label></div>`:''}</div>
 </div>`};

R.exp=()=>`
 <div class="card"><h2>${L('Additional experiences','Esperienze aggiuntive')}</h2>

R.travel=()=>{
  const e=est();
  if(!['transfer','hotel','flight'].some(k=>has('exp',k)))return `<div class="card"><h2>${L('Travel','Viaggio')}</h2><p class="lead">${L('You did not choose transfers, hotels or flights, so there is nothing to plan here. Go back to Experiences if you change your mind.','Non avete scelto trasferimenti, hotel o voli, quindi qui non c’è nulla da pianificare. Tornate alle Esperienze se cambiate idea.')}</p></div>`;
  let h='<div class="card"><h2>'+L('Travel plan','Piano di viaggio')+'</h2>';
  if(has('exp','transfer')){
    const pts=[['nce','Nice airport (NCE)','Aeroporto di Nizza (NCE)'],['goa','Genoa airport (GOA)','Aeroporto di Genova (GOA)'],['imp','Imperia station','Stazione di Imperia'],['hot','Hotel to villa','Hotel – villa']];
    h+=`<div class="tile t-sky"><h3>${L('Transfers','Trasferimenti')}</h3>
     <div class="chips">${pts.map(p=>chip('tpoints',p[0],L(p[1],p[2]))).join('')}</div>
     <div class="grid">
      <label class="f">${L('People to move','Persone da spostare')}<input type="number" inputmode="numeric" min="0" data-bind="tpax" value="${esc(S.tpax)}" placeholder="${total()}"></label>
      <label class="f">${L('How','Come')}<select data-bind="tmode"><option value="public"${S.tmode==='public'?' selected':''}>${L('Public bus or train','Bus o treno di linea')}</option><option value="private"${S.tmode==='private'?' selected':''}>${L('Private car','Auto privata')}</option><option value="shuttle"${S.tmode==='shuttle'?' selected':''}>${L('Dedicated shuttle or coach','Navetta o pullman dedicato')}</option></select></label>
      ${S.tmode==='private'?`<label class="f">${L('Cars (assumes 4 people per car, edit)','Auto (ipotesi 4 persone per auto, modificabile)')}<input type="number" min="1" data-bind="tveh" value="${esc(S.tveh)}" placeholder="${Math.ceil(e.tpax/4)}"></label>`:''}
     </div>
     <p><b>${L('Estimate','Stima')}:</b> <span class="price">${rng(e.transfer)}</span></p>
     <p class="note">${S.tmode==='public'?L('Return trips, per person: bus Nice airport – Imperia about €6–13 each way (FlixBus), train from about €17–19. Source: Rome2Rio and Omio, checked Nov 2026.','Andata e ritorno, a persona: bus aeroporto di Nizza – Imperia circa €6–13 a tratta (FlixBus), treno da circa €17–19. Fonte: Rome2Rio e Omio, novembre 2026.'):S.tmode==='private'?L('Per car and trip, Nice airport – Imperia about €270–380 (Rome2Rio estimate). Genoa airport not priced yet.','Per auto e tratta, aeroporto di Nizza – Imperia circa €270–380 (stima Rome2Rio). Aeroporto di Genova non ancora quotato.'):L('A dedicated shuttle needs a quote. The venue has private parking and easy access for shuttles and coaches.','Una navetta dedicata richiede un preventivo. La location ha parcheggio privato e accesso facile per navette e pullman.')}</p></div>`}
  if(has('exp','hotel')){
    h+=`<div class="tile t-blush"><h3>${L('Hotels','Hotel')}</h3>
     <div class="grid"><label class="f">${L('Rooms needed (default: one per 2 adults)','Camere necessarie (default: una ogni 2 adulti)')}<input type="number" min="0" data-bind="hrooms" value="${esc(S.hrooms)}" placeholder="${e.rooms}"></label></div>
     ${e.hotelTypical?`<p><b>${L('Typical estimate','Stima tipica')}:</b> <span class="price">${fmtEUR(e.hotelTypical)}</span> <span class="note">(${e.rooms} ${L('rooms','camere')} × ${e.nights} ${L('nights','notti')}, ${L('median of the list','mediana della lista')})</span>${e.hotelRange?`<br><b>${L('Your shortlist','La vostra lista')}:</b> <span class="price">${rng(e.hotelRange)}</span>`:''}</p>`:`<p class="warn">${L('Set arrival and departure dates to see an estimate.','Impostate arrivo e partenza per vedere una stima.')}</p>`}
     <p class="note">${L('26 places from Booking.com in Imperia, Diano Marina, San Bartolomeo and Sanremo, sorted by straight-line distance from the villa. Prices are for 11–13 June 2027 (2 adults, 1 room), searched 9 Nov 2026; your dates will differ.','26 strutture da Booking.com a Imperia, Diano Marina, San Bartolomeo e Sanremo, ordinate per distanza in linea d’aria dalla villa. Prezzi per 11–13 giugno 2027 (2 adulti, 1 camera), cercati il 9 nov 2026; per le vostre date cambieranno.')}</p>
     ${HOTELS.map(x=>`<div class="tile hotel" style="background:var(--surface)"><div class="row"><div><b>${esc(x.n)}</b><div class="note">${x.area} · ${x.km.toFixed(1)} km · ${L(x.type[0],x.type[1])} · ${x.r} (${x.rv} ${L('reviews','recensioni')})</div></div><div class="price">${fmtEUR(x.tot/2)}<div class="note">${L('/ night, sample','/ notte, esempio')}</div></div></div><div class="chips">${x.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="cta"><button type="button" class="chip" data-act="tog" data-k="hpicks" data-v="${x.id}" aria-pressed="${has('hpicks',x.id)}">${has('hpicks',x.id)?L('Shortlisted','In lista'):L('Shortlist','Metti in lista')}</button><a class="chip" href="${esc(bookingUrl(x))}" target="_blank" rel="noopener" style="text-decoration:none;color:var(--ink)">${L('Open on Booking.com','Apri su Booking.com')}</a></div></div>`).join('')}</div>`}
  if(has('exp','flight')){
    h+=`<div class="tile t-butter"><h3>${L('Flights','Voli')}</h3><div class="grid">
      <label class="f">${L('Flying from (city)','Partenza da (città)')}<input type="text" data-bind="fFrom" value="${esc(S.fFrom)}" placeholder="London"></label>
      <label class="f">${L('Fly into','Atterraggio')}<select data-bind="fAirport"><option value="NCE"${S.fAirport==='NCE'?' selected':''}>Nice (NCE)</option><option value="GOA"${S.fAirport==='GOA'?' selected':''}>Genoa (GOA)</option></select></label>
      <label class="f">${L('Guests flying','Ospiti che volano')}<input type="number" min="0" data-bind="fPax" value="${esc(S.fPax)}" placeholder="${e.fpax}"></label>
      <label class="f">${L('Fare per person, return (your budget)','Tariffa a persona, andata e ritorno (vostro budget)')}<input type="number" min="0" data-bind="fFare" value="${esc(S.fFare)}" placeholder="€"></label></div>
     <p><b>${L('Estimate','Stima')}:</b> <span class="price">${e.flight?fmtEUR(e.flight):L('Enter a fare to see a total','Inserite una tariffa per il totale')}</span></p>
     <p class="note">${L('Check real fares for your date on','Verificate le tariffe reali per la vostra data su')} <a href="${esc(flightUrl())}" target="_blank" rel="noopener">Google Flights</a>. ${L('Seen online: London – Genoa return from about €34 at the lowest (Skyscanner, low season).','Visto online: Londra – Genova andata e ritorno da circa €34 al minimo (Skyscanner, bassa stagione).')}</p></div>`}
  return h+'</div>'};

/* guest list & RSVP */
R.rsvp=()=>{
  const c=rsvpCounts();
  const seg=(g,k,opts)=>`<span class="seg" role="group">${opts.map(o=>`<button type="button" class="${o[3]||''}" data-act="g${k}" data-g="${g.id}" data-v="${o[0]}" aria-pressed="${g[k]===o[0]}" title="${o[1]}">${o[2]}</button>`).join('')}</span>`;
  return `<div class="card"><h2>${L('Guest list and RSVP','Lista ospiti e RSVP')}</h2>
  <p class="lead">${L('One line per guest: answer, meal and allergies. Only guests who are coming or still pending appear in the seating plan.','Una riga per ospite: risposta, pasto e allergie. Nel piano dei tavoli compaiono solo gli ospiti che vengono o ancora in attesa.')} ${S.demo?`<span class="warn">${L('These are invented example guests.','Questi sono ospiti di esempio inventati.')}</span>`:''}</p>
  <div class="kpis"><div class="kpi"><b>${c.yes}</b><span>${L('Coming','Vengono')}</span></div><div class="kpi"><b>${c.pending}</b><span>${L('Pending','In attesa')}</span></div><div class="kpi"><b>${c.no}</b><span>${L('Declined','Non vengono')}</span></div><div class="kpi"><b>${c.veg+c.vegan}</b><span>${L('Veg / vegan','Veg / vegani')}</span></div><div class="kpi"><b>${c.kid}</b><span>${L('Children','Bambini')}</span></div><div class="kpi"><b>${c.al}</b><span>${L('Allergies','Allergie')}</span></div></div>
  ${total()&&Math.abs(c.yes+c.pending-total())>0?`<p class="note">${L('Declared in the Guests step','Dichiarati nel passaggio Ospiti')}: ${total()} · ${L('on this list','in questa lista')}: ${c.yes+c.pending}. ${L('The budget uses the Guests step.','Il budget usa il passaggio Ospiti.')}</p>`:''}
  <div class="tile t-lilac"><div class="cta"><button type="button" class="btn sm" data-act="gadd">+ ${L('Add guest','Aggiungi ospite')}</button><button type="button" class="btn sm" data-act="gallyes">${L('Mark all pending as coming','Segna tutti gli in attesa come presenti')}</button></div>
   <div class="gl">${S.guests.map(g=>`<div class="grow"><div><input type="text" data-gname="${g.id}" value="${esc(g.n)}" aria-label="${L('Guest name','Nome ospite')}"><div class="chips" style="margin-top:4px;gap:4px">${seg(g,'m',[['std',L('Standard','Standard'),'Std'],['veg',L('Vegetarian','Vegetariano'),'Veg'],['vegan',L('Vegan','Vegano'),'Vgn'],['kid',L('Child','Bambino'),L('Child','Bimbo')]])}<input type="text" data-gal="${g.id}" value="${esc(g.al)}" placeholder="${L('allergy','allergia')}" style="width:110px;padding:5px 8px;border-radius:9px;font-size:.78rem"></div></div>${seg(g,'r',[['yes',L('Coming','Viene'),'✓','y'],['pending',L('Pending','In attesa'),'?','p'],['no',L('Declined','Non viene'),'✗','n']])}<button type="button" class="chip sm" data-act="gdel" data-g="${g.id}" aria-label="${L('Remove','Rimuovi')}">×</button></div>`).join('')}</div></div>
  <details><summary>${L('Paste my own guest list','Incolla la mia lista ospiti')}</summary><label class="f" style="margin-top:10px">${L('One name per line','Un nome per riga')}<textarea id="glist"></textarea></label><div class="cta" style="margin-top:10px"><button type="button" class="btn" data-act="loadguests">${L('Replace the list','Sostituisci la lista')}</button></div></details></div>`};

/* seating + floor plan */
function unseated(){const used=new Set();S.tables.forEach(t=>t.seats.forEach(s=>{if(s)used.add(s)}));return coming().filter(g=>!used.has(g.id))}
function gname(id){const g=S.guests.find(x=>x.id===id);return g?g.n:''}
function planSvg(){let trees='';for(let i=0;i<14;i++){const x=6+(i%7)*14.5+(i>6?7:0),y=i>6?92:12;trees+=`<circle cx="${x}" cy="${y}" r="2.6" fill="var(--tree)"/>`}
  return `<svg viewBox="0 0 100 75" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="100" height="75" fill="var(--hill1)"/><rect width="100" height="6" fill="var(--sea)"/><text x="2" y="4.2" class="lbl">${L('Sea view','Vista mare')}</text>
  <rect x="2" y="20" width="18" height="40" rx="2" fill="var(--blush)"/><text x="3.5" y="24" class="lbl">${L('Villa','Villa')}</text><text x="3.5" y="27.5" class="lbl s">${L('bridal suite','suite sposi')}</text>
  <rect x="38" y="20" width="24" height="16" rx="2" fill="var(--butter)"/><text x="40" y="24.2" class="lbl">${L('Dance floor','Pista')}</text>
  <rect x="80" y="20" width="18" height="9" rx="2" fill="var(--lilac)"/><text x="81.5" y="24.2" class="lbl">DJ</text>
  <rect x="80" y="31" width="18" height="9" rx="2" fill="var(--sky)"/><text x="81.5" y="35.2" class="lbl">Bar</text>
  ${trees}</svg>`}
R.seating=()=>{
  const un=unseated(),cm=coming(),seated=cm.length-un.length;
  const cols=['blush','sage','butter','lilac','sky'];
  return `<div class="card"><h2>${L('Tables and floor plan','Tavoli e planimetria')}</h2>
  <p class="lead">${L('Ten tables of ten, named after olive varieties. Drag the discs to place the tables in the olive grove. The plan is a sketch, not to scale; the venue confirms the layout.','Dieci tavoli da dieci, con nomi di varietà di olive. Trascinate i dischi per posizionare i tavoli nell’uliveto. La planimetria è uno schizzo, non in scala; la location conferma la disposizione.')}</p>
  <div class="plan" id="plan">${planSvg()}${S.tables.map((t,i)=>`<div class="disc" data-disc="${i}" style="left:${t.x}%;top:${t.y}%"><b>${esc(t.n)}</b><small>${t.seats.filter(Boolean).length}/10</small></div>`).join('')}</div>
  <div class="cta"><button type="button" class="btn sm" data-act="resetpos">${L('Reset positions','Ripristina posizioni')}</button><button type="button" class="btn sm" data-act="auto">${L('Seat everyone automatically','Sistema tutti automaticamente')}</button><button type="button" class="btn sm ghost" data-act="clear">${L('Clear seats','Svuota i posti')}</button></div>
  <p><b>${seated}</b> / ${cm.length} ${L('seated','seduti')} <span class="note">(${L('guests coming or pending','ospiti presenti o in attesa')})</span></p>
  <div class="tile t-lilac"><b>${L('Not seated yet','Ancora da sedere')} (${un.length})</b><p class="note">${L('Tap a guest, then a table.','Toccate un ospite, poi un tavolo.')}</p><div class="chips pool">${un.length?un.map(g=>`<button type="button" class="chip" data-act="pick" data-v="${g.id}" aria-pressed="${SEL===g.id}">${esc(g.n)}${g.r==='pending'?' ?':''}</button>`).join(''):`<span class="note">${L('Everyone has a seat.','Tutti hanno un posto.')}</span>`}</div></div>
  <div class="tables">${S.tables.map((t,i)=>`<div class="tbl t-${cols[i%5]}${SEL?' hot':''}" data-act="place" data-v="${i}"><input type="text" data-tname="${i}" value="${esc(t.n)}" aria-label="${L('Table name','Nome tavolo')}"><div class="seats">${t.seats.map((s,j)=>s?`<button type="button" class="seat f" data-act="unseat" data-t="${i}" data-s="${j}">${esc(gname(s))}</button>`:`<span class="seat">${j+1}</span>`).join('')}</div></div>`).join('')}</div></div>`};

/* checklist */
R.checklist=()=>{
  const it=checklist();
  const when=x=>{if(!x.date)return`<span class="note">${L('date to agree','data da concordare')}</span>`;const d=ds(x.date);if(x.done)return d;if(x.state==='over')return`<span class="bad">${d}<br>${-x.left} ${L('days ago','giorni fa')}</span>`;if(x.state==='soon')return`<span class="warn">${d}<br>${x.left===0?L('today','oggi'):L('in','tra')+' '+x.left+' '+L('days','giorni')}</span>`;return`${d}<br><span class="note">${L('in','tra')} ${x.left} ${L('days','giorni')}</span>`};
  return `<div class="card"><h2>${L('Checklist and deadlines','Checklist e scadenze')}</h2>
  <p class="lead">${L('Dates marked “Contract” come from the venue’s general terms and move with your wedding date. “Suggested” ones are ours.','Le date segnate “Contratto” vengono dalle condizioni generali della location e seguono la data delle nozze. Quelle “Suggerite” sono nostre.')}</p>
  <div class="tile t-butter"><div class="grid"><label class="f">${L('Contract signed on','Contratto firmato il')}<input type="date" data-bind="contract" value="${esc(S.contract)}"></label><label class="f">${L('Menu tasting on','Prova del menu il')}<input type="date" data-bind="tasting" value="${esc(S.tasting)}"></label></div>
  ${!S.wed?`<p class="warn">${L('Set the wedding date to see the deadlines.','Impostate la data delle nozze per vedere le scadenze.')}</p>`:''}
  <div>${it.map(x=>`<div class="chk ${x.done?'done':''}"><button type="button" class="box" data-act="check" data-v="${x.id}" aria-pressed="${x.done}" aria-label="${L('Done','Fatto')}">${x.done?'✓':''}</button><div><div class="what">${esc(L(x.en,x.it))}</div><span class="tag ${x.src}">${x.src==='terms'?L('Contract','Contratto'):x.src==='sugg'?L('Suggested','Suggerito'):L('Venue','Location')}</span></div><div class="when">${when(x)}</div></div>`).join('')}</div>

    case 'wine':S.wine=!S.wine;render();break;
    case 'example':example();break;
    case 'pick':SEL=SEL===v?null:v;render();break;
    case 'place':{if(!SEL)break;const t=S.tables[parseInt(v,10)];if(t.seats.indexOf(null)<0){toast(L('That table is full','Tavolo completo'));break}S.tables.forEach(x=>x.seats=x.seats.map(s=>s===SEL?null:s));t.seats[t.seats.indexOf(null)]=SEL;SEL=null;render();break}
    case 'unseat':{S.tables[parseInt(el.dataset.t,10)].seats[parseInt(el.dataset.s,10)]=null;ev.stopPropagation();render();break}
    case 'auto':{S.tables.forEach(t=>t.seats=Array(10).fill(null));const q=coming().map(g=>g.id);S.tables.forEach(t=>{for(let j=0;j<10&&q.length;j++)t.seats[j]=q.shift()});if(q.length)toast(q.length+' '+L('guests did not fit in 10 tables','ospiti non entrano in 10 tavoli'));render();break}
    case 'clear':S.tables.forEach(t=>t.seats=Array(10).fill(null));render();break;
    case 'resetpos':S.tables.forEach((t,i)=>{t.x=DEFPOS[i%10][0];t.y=DEFPOS[i%10][1]});render();break;
    case 'loadguests':{const txt=($('#glist')||{}).value||'';const names=txt.split('\n').map(x=>x.trim()).filter(Boolean);if(!names.length){toast(L('Type at least one name','Scrivete almeno un nome'));break}S.guests=names.map((n,i)=>({id:'u'+Date.now().toString(36)+i,n,r:'pending',m:'std',al:''}));S.demo=false;S.tables.forEach(t=>t.seats=Array(10).fill(null));render();break}
    case 'gadd':{if(S.demo){S.guests=[];S.demo=false;S.tables.forEach(t=>t.seats=Array(10).fill(null))}S.guests.unshift({id:'u'+Date.now().toString(36),n:'',r:'pending',m:'std',al:''});render();const f=document.querySelector('[data-gname]');if(f)f.focus();break}
    case 'gdel':{S.guests=S.guests.filter(g=>g.id!==el.dataset.g);S.tables.forEach(t=>t.seats=t.seats.map(s=>s===el.dataset.g?null:s));render();break}
    case 'gr':case 'gm':{const g=S.guests.find(x=>x.id===el.dataset.g);if(g){g[a==='gr'?'r':'m']=v;if(a==='gr'&&v==='no')S.tables.forEach(t=>t.seats=t.seats.map(s=>s===g.id?null:s))}render();break}
    case 'gallyes':S.guests.forEach(g=>{if(g.r==='pending')g.r='yes'});render();break;
    case 'check':S.checks[v]=!S.checks[v];render();break;
    case 'fb':S.fb[k]=(S.fb[k]||0)+parseInt(el.dataset.d,10);toast(parseInt(el.dataset.d,10)>0?L('Thanks, we will show more like this','Grazie, ne mostreremo di simili'):L('Understood, hidden','Capito, nascosto'));render();break;
    case 'pdf':makePdf();break;
    case 'copy':copyText(asText());break;
    case 'share':{const t=asText();if(navigator.share){navigator.share({title:'Uliveto wedding plan',text:t}).catch(()=>{})}else copyText(t);break}
    case 'reset':{if(el.dataset.sure){S=blank();S.lang=LANG;SEL=null;dirty();go(0)}else{el.dataset.sure='1';el.textContent=L('Tap again to erase everything','Toccate ancora per cancellare tutto')}break}
    case 'vopen':VSEL=v;render();window.scrollTo({top:0});break;
    case 'vback':VSEL=null;render();break;
    case 'vreload':VP=null;render();break;
    case 'vclose':location.hash='';render();break;
    case 'vcopy':{const st=(VP||[]).find(p=>p.uid===v);if(st)copyText(asText(st));break}
  }
  if(!NOMUT.has(a))dirty();
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.tname!==undefined){S.tables[parseInt(t.dataset.tname,10)].n=t.value;dirty();return}
  if(t.dataset.gname){const g=S.guests.find(x=>x.id===t.dataset.gname);if(g){g.n=t.value;dirty()}return}
  if(t.dataset.gal){const g=S.guests.find(x=>x.id===t.dataset.gal);if(g){g.al=t.value;dirty()}return}
  const k=t.dataset.bind;if(!k)return;S[k]=t.value;dirty();
});
document.addEventListener('change',ev=>{const t=ev.target;const k=t.dataset.bind;if(!k)return;S[k]=t.value;dirty();if(['arrive','wed','depart','tmode','fAirport','tpax','hrooms','fPax','fFare','fFrom','tveh','contract','tasting','lateHours'].includes(k))render()});
/* floor plan drag */
let drag=null;
document.addEventListener('pointerdown',ev=>{const d=ev.target.closest('.disc');if(!d)return;const plan=$('#plan');if(!plan)return;const i=parseInt(d.dataset.disc,10);drag={i,el:d,rect:plan.getBoundingClientRect()};d.classList.add('drag');try{d.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()});
document.addEventListener('pointermove',ev=>{if(!drag)return;const x=Math.max(7,Math.min(93,(ev.clientX-drag.rect.left)/drag.rect.width*100)),y=Math.max(9,Math.min(91,(ev.clientY-drag.rect.top)/drag.rect.height*100));drag.el.style.left=x+'%';drag.el.style.top=y+'%';drag.x=x;drag.y=y});
const endDrag=()=>{if(!drag)return;if(drag.x!==undefined){S.tables[drag.i].x=Math.round(drag.x*10)/10;S.tables[drag.i].y=Math.round(drag.y*10)/10;dirty()}drag.el.classList.remove('drag');drag=null};
document.addEventListener('pointerup',endDrag);document.addEventListener('pointercancel',endDrag);
$('#l-en').onclick=()=>{LANG='en';S.lang='en';save();render()};
$('#l-it').onclick=()=>{LANG='it';S.lang='it';save();render()};
$('#venuebtn').onclick=()=>{location.hash=venueMode()?'':'#venue';render()};
window.addEventListener('hashchange',render);
render();
initSync();

/* ---------- install screen: shown first on every open until the app is on the home screen ---------- */
const APP_URL=location.origin+location.pathname;
let deferredPrompt=null,PLAT=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;renderInstall()});
function standalone(){try{return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true}catch(e){return false}}
function installDismissed(){try{return localStorage.getItem('uliveto-installed')==='1'||sessionStorage.getItem('uliveto-install-later')==='1'}catch(e){return false}}
function detectPlat(){const ua=navigator.userAgent||'';if(/android/i.test(ua))return'android';if(/iphone|ipad|ipod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1))return'ios';return'desktop'}
function renderInstall(){
  const box=$('#install');if(standalone()||installDismissed()){box.hidden=true;return}
  PLAT=PLAT||detectPlat();
  const steps={
    android:[[L('Open this link in <kbd>Chrome</kbd>','Aprite questo link in <kbd>Chrome</kbd>')],[L('Tap the <kbd>⋮</kbd> menu at the top right','Toccate il menu <kbd>⋮</kbd> in alto a destra')],[L('Choose <kbd>Add to Home screen</kbd> or <kbd>Install app</kbd>, then <kbd>Add</kbd>','Scegliete <kbd>Aggiungi a schermata Home</kbd> o <kbd>Installa app</kbd>, poi <kbd>Aggiungi</kbd>')]],
    ios:[[L('Open this link in <kbd>Safari</kbd>','Aprite questo link in <kbd>Safari</kbd>')],[L('Tap the <kbd>Share</kbd> button (square with an arrow)','Toccate il pulsante <kbd>Condividi</kbd> (quadrato con freccia)')],[L('Scroll and choose <kbd>Add to Home Screen</kbd>, then <kbd>Add</kbd>','Scorrete e scegliete <kbd>Aggiungi alla schermata Home</kbd>, poi <kbd>Aggiungi</kbd>')]],
    desktop:[[L('Scan the code with your phone camera, or send yourself the link','Inquadrate il codice con la fotocamera del telefono, o inviatevi il link')],[L('On the phone, follow the Android or iPhone steps','Sul telefono seguite i passaggi Android o iPhone')]]};
  box.innerHTML=`<div class="in">
    <div class="lang" role="group" aria-label="Language"><button type="button" data-ilang="en" aria-pressed="${LANG==='en'}">EN</button><button type="button" data-ilang="it" aria-pressed="${LANG==='it'}">IT</button></div>
    <div class="appicon"><div class="logo" role="img" aria-label="Casa della Rocca Uliveto"></div></div>
    <div><h2>${L('Install the Uliveto Wedding Planner','Installate l’Uliveto Wedding Planner')}</h2><p class="lead" style="margin-top:8px">${L('Put it on your home screen like an app: it opens full screen, with this icon, and keeps your plan.','Mettetelo sulla schermata Home come un’app: si apre a schermo intero, con questa icona, e conserva il vostro piano.')}</p></div>
    ${deferredPrompt?`<button type="button" class="btn pri" data-inst="now">${L('Install now','Installa ora')}</button>`:''}
    <div class="ptabs" role="group">${[['android','Android'],['ios','iPhone'],['desktop',L('Computer','Computer')]].map(p=>`<button type="button" data-plat="${p[0]}" aria-pressed="${PLAT===p[0]}">${p[1]}</button>`).join('')}</div>
    <div class="steps">${steps[PLAT].map((s,i)=>`<div class="step"><i>${i+1}</i><div>${s[0]}</div></div>`).join('')}</div>
    ${PLAT==='desktop'?`<div class="qr" id="qr"></div><p class="note" style="word-break:break-all">${APP_URL}</p><button type="button" class="btn sm" data-inst="copy">${L('Copy link','Copia link')}</button>`:''}
    <div class="cta" style="justify-content:center"><button type="button" class="btn" data-inst="done">${L('It’s on my home screen','È sulla schermata Home')}</button><button type="button" class="btn ghost" data-inst="later">${L('Later','Dopo')}</button></div>
    <p class="note">${L('The icon on the home screen is set by the phone and may differ from the one above.','L’icona sulla schermata Home la decide il telefono e può differire da quella sopra.')}</p>
  </div>`;
  box.hidden=false;
  if(PLAT==='desktop'&&window.qrcode){try{const q=window.qrcode(0,'M');q.addData(APP_URL);q.make();$('#qr').innerHTML=q.createImgTag(4,0);$('#qr img').style.width='168px';$('#qr img').style.height='168px'}catch(e){}}
}
$('#install').addEventListener('click',async ev=>{
  const lb=ev.target.closest('[data-ilang]');if(lb){LANG=lb.dataset.ilang;S.lang=LANG;save();render();renderInstall();return}
  const pb=ev.target.closest('[data-plat]');if(pb){PLAT=pb.dataset.plat;renderInstall();return}
  const b=ev.target.closest('[data-inst]');if(!b)return;
  switch(b.dataset.inst){
    case 'now':{if(!deferredPrompt)break;const p=deferredPrompt;deferredPrompt=null;try{p.prompt();const r=await p.userChoice;if(r&&r.outcome==='accepted'){try{localStorage.setItem('uliveto-installed','1')}catch(e){}}}catch(e){}renderInstall();break}
    case 'done':try{localStorage.setItem('uliveto-installed','1')}catch(e){}$('#install').hidden=true;break;
    case 'later':try{sessionStorage.setItem('uliveto-install-later','1')}catch(e){}$('#install').hidden=true;break;
    case 'copy':copyText(APP_URL);break;
  }
});
window.addEventListener('appinstalled',()=>{try{localStorage.setItem('uliveto-installed','1')}catch(e){}$('#install').hidden=true});
renderInstall();
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})})}
})();
</script>
